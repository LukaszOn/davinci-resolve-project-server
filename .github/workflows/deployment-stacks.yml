name: Deployment stacks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: davinci-resolve-project-server.yml
            postgres: 18
            panel: false
          - file: davinci-resolve-project-server-with-manager.yml
            postgres: 18
            panel: true
          - file: davinci-resolve-project-server-with-manager.yml
            postgres: 16
            panel: true
            db_user: studio_panel
    env:
      POSTGRES_VERSION: ${{ matrix.postgres }}
      POSTGRES_PASSWORD: ci-only-project-server
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ci-only-admin-console
      PANEL_ADMIN_PASSWORD: ci-only-panel-admin-password-for-tests
      PANEL_DB_USER: ${{ matrix.db_user }}
      PANEL_BUILD_CONTEXT: ${{ github.workspace }}/panel
      RESOLVE_LIBRARY: deployment_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare a single Compose file
        run: |
          mkdir "$RUNNER_TEMP/deployment-test"
          cp "${{ matrix.file }}" "$RUNNER_TEMP/deployment-test/compose.yml"
          cd "$RUNNER_TEMP/deployment-test"
          docker compose config --quiet
      - name: Deploy with Docker Compose
        working-directory: ${{ runner.temp }}/deployment-test
        run: |
          docker compose up -d --wait --wait-timeout 240
      - name: Verify first library and its backup
        working-directory: ${{ runner.temp }}/deployment-test
        run: |
          curl --retry 45 --retry-delay 2 --retry-all-errors --fail --silent --show-error http://127.0.0.1:3001/misc/ping
          if [ "${{ matrix.panel }}" = true ]; then
            curl --retry 30 --retry-delay 2 --retry-all-errors --fail --silent --show-error http://127.0.0.1:3012/login >/dev/null
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3012/healthz)" = 503
          fi
          docker compose exec -T postgres createdb -U postgres "$RESOLVE_LIBRARY"
          docker compose exec -T postgres psql -X -U postgres -d "$RESOLVE_LIBRARY" -v ON_ERROR_STOP=1 -c 'CREATE TABLE project_fixture (value integer); INSERT INTO project_fixture VALUES (42);'
          docker compose exec -T pgbackups /backup.sh
          docker compose exec -T pgbackups sh -ec 'archive=$(find /backups/last -type f -name "deployment_test-*.backup" | head -n 1); test -n "$archive"; pg_restore --list "$archive" | grep project_fixture'
      - name: Check automatic panel setup and repeat it
        if: matrix.panel
        working-directory: ${{ runner.temp }}/deployment-test
        run: |
          curl --retry 30 --retry-delay 2 --fail --silent --show-error http://127.0.0.1:3012/healthz
          test "$(docker compose exec -T postgres psql -XAtw -U postgres -d postgres -c 'SELECT name FROM resolve_access.available_libraries')" = "$RESOLVE_LIBRARY"
          test "$(docker compose exec -T postgres psql -XAtw -U postgres -d postgres -c 'SELECT username FROM resolve_access.panel_service_account')" = "${PANEL_DB_USER:-resolve_panel_agent}"
          before=$(docker compose exec -T resolve-panel sha256sum /run/resolve-panel/session-key /run/resolve-panel/agent-password)
          docker compose start panel-setup
          test "$(docker wait "$(docker compose ps -aq panel-setup)")" = 0
          after=$(docker compose exec -T resolve-panel sha256sum /run/resolve-panel/session-key /run/resolve-panel/agent-password)
          test "$before" = "$after"
          curl --fail --silent --show-error http://127.0.0.1:3012/healthz
      - name: Check default English and switch to Polish
        if: matrix.panel
        working-directory: ${{ runner.temp }}/deployment-test
        run: |
          base=http://127.0.0.1:3012
          curl --fail --silent --show-error --cookie-jar cookies.txt "$base/login" > login-en.html
          grep -q '<html lang="en">' login-en.html
          grep -q 'Sign in to the panel' login-en.html
          csrf=$(sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p' login-en.html | head -n 1)
          test -n "$csrf"
          curl --fail --silent --show-error --location --cookie cookies.txt --cookie-jar cookies.txt \
            --data-urlencode "csrf=$csrf" --data-urlencode language=pl "$base/language" > login-pl.html
          grep -q '<html lang="pl">' login-pl.html
          grep -q 'Zaloguj się do panelu' login-pl.html
      - name: Rename the configured panel account
        if: matrix.panel
        working-directory: ${{ runner.temp }}/deployment-test
        run: |
          role_oid() {
            docker compose exec -T postgres psql -XAtqw -v ON_ERROR_STOP=1 -U postgres -d postgres -v role="$1" <<'SQL'
          SELECT oid FROM pg_roles WHERE rolname = :'role';
          SQL
          }
          old_user=${PANEL_DB_USER:-resolve_panel_agent}
          before=$(role_oid "$old_user")
          test -n "$before"
          export PANEL_DB_USER=renamed_panel
          docker compose up -d panel-setup resolve-panel
          test "$(docker wait "$(docker compose ps -aq panel-setup)")" = 0
          test "$(role_oid "$PANEL_DB_USER")" = "$before"
          test -z "$(role_oid "$old_user")"
          curl --retry 30 --retry-delay 2 --retry-all-errors --fail --silent --show-error http://127.0.0.1:3012/healthz
      - name: Print stack logs on failure
        if: failure()
        run: |
          cd "$RUNNER_TEMP/deployment-test"
          docker compose ps -a
          docker compose logs --tail 80
