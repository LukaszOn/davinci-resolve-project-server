x-postgres: &postgres-environment
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  TZ: ${TZ:-UTC}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    restart: unless-stopped
    ports:
      - target: 5432
        published: "5432"
        host_ip: ${POSTGRES_BIND_IP:-127.0.0.1}
        protocol: tcp
    environment:
      <<: *postgres-environment
      POSTGRES_DB: ${POSTGRES_DB:-database}
      PGDATA: /var/lib/postgresql/${POSTGRES_VERSION:-18}/docker
    volumes:
      - type: bind
        source: ${POSTGRES_DATA_DIR:-./data/postgres-${POSTGRES_VERSION:-18}}
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15

  pgbackups:
    image: prodrigestivill/postgres-backup-local:${POSTGRES_VERSION:-18}
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -w /hooks ]; then
          echo 'Backup reporting is unavailable because /hooks is read-only.' >&2
          exec /init.sh
        fi
        cat > /hooks/report-library-backup <<'HOOK'
        #!/bin/sh
        [ "$$1" = post-backup ] || exit 0
        PGOPTIONS='-c lock_timeout=3s -c statement_timeout=10s' psql -Xqw -1 -v ON_ERROR_STOP=1 -d postgres -v databases="$$POSTGRES_DB" <<'SQL' || echo 'Archive saved; Manager backup status could not be updated.' >&2
        SELECT format('ALTER DATABASE %I SET davinci_manager.last_backup_utc TO %L', datname,
                      to_char(clock_timestamp() AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS"Z"'))
        FROM pg_catalog.pg_database
        WHERE datname = ANY(regexp_split_to_array(:'databases', '[,[:space:]]+'))
        \gexec
        SQL
        HOOK
        chmod 755 /hooks/report-library-backup
        exec /init.sh
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-environment
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${BACKUP_DATABASES:-${RESOLVE_LIBRARY:-studio}}
      VALIDATE_ON_START: "FALSE"
      SCHEDULE: ${BACKUP_SCHEDULE:-30 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      POSTGRES_EXTRA_OPTS: --blobs --format=custom --quote-all-identifiers
      BACKUP_SUFFIX: .backup
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups"
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin-config:
    build: ./pgadmin-config-creator
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - pgadmin-config:/config

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgadmin-config:
        condition: service_completed_successfully
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4-config/servers.json
    ports:
      - target: 80
        published: "${PGADMIN_PORT:-3001}"
        host_ip: ${PGADMIN_BIND_IP:-127.0.0.1}
        protocol: tcp
    volumes:
      - pgadmin-config:/pgadmin4-config:ro
      - pgadmin:/var/lib/pgadmin
      - "${BACKUP_DIR:-./backups}:/backups:ro"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        account="$$(printf '%s' "$${PGADMIN_DEFAULT_EMAIL}" | tr '@' '_')"
        storage="/var/lib/pgadmin/storage/$$account"
        mkdir -p "$$storage"
        if [ ! -e "$$storage/backups" ] && [ ! -L "$$storage/backups" ]; then
          ln -s /backups "$$storage/backups"
        fi
        exec /entrypoint.sh
    healthcheck:
      test: ["CMD", "/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 8

volumes:
  pgadmin-config:
  pgadmin:
