{% extends 'base.html' %}
{% block title %}Logowanie{% endblock %}
{% block body %}
<main class="single">
  <div class="single-card">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span><strong>{{ panel_display_name }}</strong><small>Biblioteki DaVinci Resolve</small></span></div>
    <h1>Zaloguj się do panelu</h1>
    <p>Użyj danych administratora. Dla głównego hasła panelu zostaw login pusty.</p>
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="single-form">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Login administratora<input name="username" autocomplete="username" maxlength="31" autocapitalize="none"></label>
      <label>Hasło<input name="password" type="password" required autocomplete="current-password" autofocus></label>
      <button type="submit" class="button primary">Zaloguj się</button>
    </form>
  </div>
</main>
{% endblock %}
